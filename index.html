<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vim Wall Card</title>
    <link rel="stylesheet" href="css/card.css">
  </head>
  <body>
    <div class="card">
      <header>
        <div class="title-row">
          <h1>Vim Wall Card</h1>
          <div id="count"></div>
        </div>
        <form id="search-form" class="search" role="search">
          <input id="search" type="text" placeholder="Try delete word, save, inside quotes" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search Vim commands by what they do">
          <button type="button" id="clear" hidden aria-label="Clear search">×</button>
        </form>
      </header>
      <div id="list"></div>
    </div>
    <script src="js/search.js"></script>
    <script src="data/commands.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
